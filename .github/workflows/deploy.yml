# OuroborosAI Program Discovery — CI/CD
#
# Triggers:
#   - pull_request (main, develop): full CI except Trivy and GHCR push (image is built with `load:` only).
#   - push (main only): same CI + push image to GHCR + Trivy scan on the pushed image + LLM eval.
#
# Stage overview (dependency order):
#   1. format-check, lint-check, unit-tests — parallel; separate format vs lint for clearer failure signals in the UI.
#   2. prompt-lint, type-check, integration-tests, security-static, security-scan — parallel; each needs (1) to pass.
#   3. docker-build — needs (2); builds always; pushes to ghcr.io only on push to main (see inline comments).
#   4. trivy-scan, llm-eval — push-to-main only; scans the image tag that was just pushed.
#   5. reports-summary — needs all above; uses `if: always()` so it still runs when trivy-scan is skipped on PRs.
#
# Action major tags (verified on GitHub):
#   actions/checkout@v6 — https://github.com/actions/checkout/releases
#   actions/setup-python@v6 — https://github.com/actions/setup-python/releases
#   actions/upload-artifact@v6 — https://github.com/actions/upload-artifact/releases
#   docker/setup-buildx-action@v4 — https://github.com/docker/setup-buildx-action/releases
#   docker/build-push-action@v7 — https://github.com/docker/build-push-action/releases
#
# Older action bundles shipped with Node 20; newer majors run on Node 24.
# See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/

name: OuroborosAI Program Discovery CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Format, lint, and unit tests (parallel)
  # ---------------------------------------------------------------------------
  format-check:
    name: Code Formatting (Black & isort)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check formatting (Black)
        run: black --check --diff app/ tests/

      - name: Check import sorting (isort)
        run: isort --check-only --diff app/ tests/

  lint-check:
    name: Code Lint (flake8 & pylint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run flake8
        run: flake8 app/ tests/ --max-line-length=120 --extend-ignore=E203,W503,E501

      - name: Run pylint
        run: pylint app/ tests/ --max-line-length=120 --disable=C0111,R0903,R0913,R0914,R0911,R0912,R0915,R0917,W0212,W0621,W0718,C0415,W0107,E0401

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        env:
          ALLOW_DB_FAILURE: "true"
          USE_MOCK_DATA: "true"
          INTERNAL_TOKEN_VERIFY_ENABLED: "false"
          MYSQL_HOST: "localhost"
          MYSQL_DATABASE: "test_db"
          MYSQL_USER: "test_user"
          MYSQL_PASSWORD: "test_pass"
        run: pytest tests/unit/ -v --tb=short --junitxml=junit-report.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: junit-report.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Stage 2: LLMOps, Type check, coverage, static + dependency security (parallel)
  # Requires Stage 1 (format-check, lint-check, unit-tests).
  # ---------------------------------------------------------------------------
  prompt-lint:
    name: Prompt Lint & Token Validation
    runs-on: ubuntu-latest
    needs: [format-check, lint-check, unit-tests]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run LLMOps prompt tests
        env:
          ALLOW_DB_FAILURE: "true"
          USE_MOCK_DATA: "true"
        run: pytest tests/llm -v --tb=short

  prompt-diff-alert:
    name: Prompt Change Detector
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [format-check, lint-check, unit-tests]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed prompt files
        id: prompt-diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD --name-only | grep -E "(app/llm/|tests/llm/fixtures/|prompts/)" > changed_prompts.txt || true
          if [ -s changed_prompts.txt ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "files=$(cat changed_prompts.txt | xargs)" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR if prompts changed
        if: steps.prompt-diff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          COMMENT="**Prompt Files Changed**\n\nThe following prompt-related files were modified in this PR:\n\`\`\`\n$(cat changed_prompts.txt)\n\`\`\`\n\nLLM evaluation will run automatically after merging to \`main\` to detect any quality regression."
          gh pr comment $PR_URL --body "$COMMENT"
          echo -e "$COMMENT" >> $GITHUB_STEP_SUMMARY

  pii-guard-changes:
    name: Detect fixture changes for PII guard
    runs-on: ubuntu-latest
    needs: [format-check, lint-check, unit-tests]
    permissions:
      contents: read
      pull-requests: read
    outputs:
      fixtures_changed: ${{ steps.filter.outputs.fixtures }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Detect changed fixture files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            fixtures:
              - 'tests/llm/fixtures/**'
              - 'scripts/check_pii.py'

  pii-guard:
    name: PII Guard (Fixtures)
    runs-on: ubuntu-latest
    needs: [format-check, lint-check, unit-tests, pii-guard-changes]
    if: needs.pii-guard-changes.outputs.fixtures_changed == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check for PII in fixtures
        run: python scripts/check_pii.py --path tests/llm/fixtures/

  type-check:
    name: Type Checking (mypy)
    runs-on: ubuntu-latest
    needs: [format-check, lint-check, unit-tests]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run mypy
        run: mypy app/ --ignore-missing-imports --no-strict-optional

  integration-tests:
    name: Tests with Coverage
    runs-on: ubuntu-latest
    needs: [format-check, lint-check, unit-tests]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run integration tests with coverage
        env:
          ALLOW_DB_FAILURE: "true"
          USE_MOCK_DATA: "true"
          INTERNAL_TOKEN_VERIFY_ENABLED: "false"
          MYSQL_HOST: "localhost"
          MYSQL_DATABASE: "test_db"
          MYSQL_USER: "test_user"
          MYSQL_PASSWORD: "test_pass"
        run: pytest tests/integration/ --cov=app --cov-report=html --cov-report=xml -v

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

      - name: Upload coverage XML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  security-static:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest
    needs: [format-check, lint-check, unit-tests]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Bandit
        run: bandit -r app/ -f json -o bandit-report.json -c bandit.yaml

      - name: Upload Bandit report
        if: always() && hashFiles('bandit-report.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: security-reports-bandit
          path: bandit-report.json
          retention-days: 7

  security-scan:
    name: Security Scan (Snyk OSS)
    runs-on: ubuntu-latest
    needs: [format-check, lint-check, unit-tests]
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Skip Snyk (no token)
        if: env.SNYK_TOKEN == ''
        run: echo "SNYK_TOKEN not set; skipping Snyk OSS scan. Add repo secret to enforce dependency checks."

      - name: Setup Snyk CLI
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/setup@v1.0.0

      - name: Install dependencies for Snyk resolution
        if: env.SNYK_TOKEN != ''
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Snyk dependency test
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        id: snyk-test
        run: |
          snyk auth "$SNYK_TOKEN"
          snyk test \
            --file=requirements.txt \
            --severity-threshold=high \
            --skip-unresolved=true \
            --sarif-file-output=snyk.sarif

      - name: Check Snyk results
        if: env.SNYK_TOKEN != '' && steps.snyk-test.outcome == 'failure'
        run: |
          echo "::warning::Snyk scan reported issues. Check the SARIF artifact for details."

      - name: Upload Snyk SARIF to Code Scanning
        if: vars.ENABLE_CODE_SCANNING_SARIF == 'true' && env.SNYK_TOKEN != '' && always() && hashFiles('snyk.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif

      - name: Upload Snyk SARIF artifact
        if: env.SNYK_TOKEN != '' && always() && hashFiles('snyk.sarif') != ''
        uses: actions/upload-artifact@v6
        with:
          name: snyk-sarif
          path: snyk.sarif

  # ---------------------------------------------------------------------------
  # Stage 3: Docker build → GHCR (push only on merge to main, not on PR)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - prompt-lint
      - pii-guard
      - type-check
      - integration-tests
      - security-static
      - security-scan
    if: |
      always() &&
      needs.prompt-lint.result == 'success' &&
      (needs.pii-guard.result == 'success' || needs.pii-guard.result == 'skipped') &&
      needs.type-check.result == 'success' &&
      needs.integration-tests.result == 'success' &&
      needs.security-static.result == 'success' &&
      needs.security-scan.result == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Stage 4: Trivy (after image push to GHCR on main)
  # ---------------------------------------------------------------------------
  trivy-scan:
    name: Trivy Scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [docker-build]
    permissions:
      contents: read
      packages: read
      security-events: write
      actions: read
    steps:
      - name: Log in to GitHub Container Registry (pull)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy SARIF scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          format: sarif
          output: trivy.sarif

      - name: Upload Trivy SARIF to Code Scanning
        if: vars.ENABLE_CODE_SCANNING_SARIF == 'true' && always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif

      - name: Run Trivy JSON scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          format: json
          output: trivy-results.json

      - name: Upload Trivy report artifact
        if: always() && hashFiles('trivy-results.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: trivy-report
          path: trivy-results.json

  # ---------------------------------------------------------------------------
  # Stage 5: LLM Evaluation & AI Governance
  # ---------------------------------------------------------------------------
  llm-eval:
    name: LLM Output Quality Eval
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [docker-build]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVAL_BASELINE_SCORE: ${{ vars.EVAL_BASELINE_SCORE || '0.0' }}
      ALLOW_DB_FAILURE: "true"
      BIAS_THRESHOLD: "1.5"
      BIAS_HARD_LIMIT: "3.0"
    permissions:
      contents: write
      actions: write
    steps:
      - name: Skip eval when OpenAI key is missing
        if: env.OPENAI_API_KEY == ''
        run: |
          echo "OPENAI_API_KEY is not set; skipping LLM eval." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout code
        if: env.OPENAI_API_KEY != ''
        uses: actions/checkout@v6

      - name: Set up Python
        if: env.OPENAI_API_KEY != ''
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: env.OPENAI_API_KEY != ''
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LLM evaluations
        if: env.OPENAI_API_KEY != ''
        run: python scripts/run_llm_eval.py

      - name: Update eval baseline
        if: success() && env.OPENAI_API_KEY != ''
        env:
          # Use ACTIONS_VARIABLES_TOKEN (PAT with repo scope) for updating variables
          # Falls back to GITHUB_TOKEN but that typically lacks variable write permissions
          GITHUB_TOKEN: ${{ secrets.ACTIONS_VARIABLES_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/store_eval_baseline.py

      - name: Push eval history to audit branch
        if: always() && env.OPENAI_API_KEY != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/push_eval_history.py

      - name: Upload eval results
        if: always() && hashFiles('eval_results.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: eval-results
          path: eval_results.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Stage 6: Summary artifact for all jobs.
  # ---------------------------------------------------------------------------
  reports-summary:
    name: CI Summary & Report Bundle
    runs-on: ubuntu-latest
    needs:
      - format-check
      - lint-check
      - unit-tests
      - prompt-lint
      - prompt-diff-alert
      - pii-guard
      - type-check
      - integration-tests
      - security-static
      - security-scan
      - docker-build
      - trivy-scan
      - llm-eval
    if: always()
    permissions:
      contents: read
      actions: read
    steps:
      - name: Create CI summary
        run: |
          {
            echo "# OuroborosAI Program Discovery — CI Reports";
            echo "- Commit: $GITHUB_SHA";
            echo "- Ref: $GITHUB_REF";
            echo "- Container image: ghcr.io/${{ github.repository }}";
            echo "";
            echo "## Job results";
            echo "- Formatting (Black/isort): ${{ needs.format-check.result }}";
            echo "- Lint (flake8/pylint): ${{ needs.lint-check.result }}";
            echo "- Unit Tests: ${{ needs.unit-tests.result }}";
            echo "- Prompt Lint: ${{ needs.prompt-lint.result }}";
            echo "- Prompt Diff Alert: ${{ needs.prompt-diff-alert.result }}";
            echo "- PII Guard: ${{ needs.pii-guard.result }}";
            echo "- Type Check (mypy): ${{ needs.type-check.result }}";
            echo "- Tests + Coverage: ${{ needs.integration-tests.result }}";
            echo "- Bandit: ${{ needs.security-static.result }}";
            echo "- Snyk OSS: ${{ needs.security-scan.result }}";
            echo "- Docker Build/Push: ${{ needs.docker-build.result }}";
            echo "- Trivy (container scan): ${{ needs.trivy-scan.result }}";
            echo "- LLM Eval: ${{ needs.llm-eval.result }}";
            echo "";
            echo "_Trivy and LLM Eval run on push to main only; on PRs they are skipped._";
          } > summary.md

      - name: Upload consolidated report bundle
        uses: actions/upload-artifact@v6
        with:
          name: ci-reports
          path: summary.md
