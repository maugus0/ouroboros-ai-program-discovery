version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: program-discovery-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-ouroboros_program_db}
    ports:
      - "${DOCKER_MYSQL_PORT:-3309}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  program-discovery:
    build: .
    container_name: program-discovery-service
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8002:8002"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${DB_NAME:-ouroboros_program_db}
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${DB_PASSWORD:-root_password}
      - ALLOW_DB_FAILURE=false
      - INTERNAL_TOKEN_VERIFY_ENABLED=${INTERNAL_TOKEN_VERIFY_ENABLED:-false}
      - INTERNAL_TOKEN_SIGNING_ALGORITHM=${INTERNAL_TOKEN_SIGNING_ALGORITHM:-RS256}
      - INTERNAL_TOKEN_JWKS_URL=${INTERNAL_TOKEN_JWKS_URL:-}
      - INTERNAL_TOKEN_AUDIENCE=${INTERNAL_TOKEN_AUDIENCE:-ouroboros.program-discovery}
      - INTERNAL_TOKEN_ISSUER=${INTERNAL_TOKEN_ISSUER:-ouroboros-orchestrator-internal}
      - LOG_LEVEL=DEBUG
    volumes:
      - .:/app
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload

volumes:
  mysql_data:
